version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: astraflare-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: astraflare
    volumes:
      - mongo_data:/data/db
    networks:
      - astraflare-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: astraflare-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASS}
    volumes:
      - redis_data:/data
    networks:
      - astraflare-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: astraflare-ml
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./ml-service:/app
      - ml_models:/app/saved_models
    networks:
      - astraflare-net
    deploy:
      resources:
        limits:
          memory: 4G

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: astraflare-server
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - astraflare-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: astraflare-client
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - astraflare-net

  nginx:
    image: nginx:alpine
    container_name: astraflare-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - server
      - client
    networks:
      - astraflare-net

volumes:
  mongo_data:
  redis_data:
  ml_models:

networks:
  astraflare-net:
    driver: bridge